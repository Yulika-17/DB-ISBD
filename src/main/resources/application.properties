server.port=${SERVER_PORT:2222}
server.address=${SERVER_ADDRESS:0.0.0.0}

vecdb.name=${VECDB_NAME:vecdb}
vecdb.data-directory=${VECDB_DATA_DIRECTORY:./data}
vecdb.auto-save=${VECDB_AUTO_SAVE:true}
vecdb.save-interval=${VECDB_SAVE_INTERVAL:5s}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
