server.port=${SERVER_PORT:2222}
server.address=${SERVER_ADDRESS:0.0.0.0}

vecdb.name=${VECDB_NAME:vecdb}
vecdb.data-directory=${VECDB_DATA_DIRECTORY:./data}
vecdb.auto-save=${VECDB_AUTO_SAVE:true}
vecdb.save-interval=${VECDB_SAVE_INTERVAL:5s}
vecdb.role=${VECDB_ROLE:STANDALONE}
vecdb.replication-port=${VECDB_REPLICATION_PORT:4700}
vecdb.master-host=${VECDB_MASTER_HOST:127.0.0.1}
vecdb.master-port=${VECDB_MASTER_PORT:4700}
vecdb.replication-delay-ms=${VECDB_REPLICATION_DELAY_MS:0}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
